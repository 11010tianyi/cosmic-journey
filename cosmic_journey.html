<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <meta name="description" content="从可观测宇宙缩放到你站立的地方。对数尺度、哲学摘引、2076 场景与可选定位问候。">
    <title>宇宙尺度之旅 — 从可观测宇宙到你</title>
    <link rel="canonical" href="./" />
    <script src="p5.min.js?v=5" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js'"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cosmos-black: #050510;
            --cosmos-deep: #0a0a2e;
            --nebula-purple: #2d1b69;
            --star-blue: #4fc3f7;
            --star-gold: #ffd54f;
            --earth-green: #66bb6a;
            --earth-blue: #42a5f5;
            --text-primary: #e8e6f0;
            --text-secondary: #9e99b8;
            --accent-cyan: #00e5ff;
            --accent-orange: #ff6d00;
            --glass-bg: rgba(10, 10, 46, 0.75);
            --glass-border: rgba(79, 195, 247, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--cosmos-black);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 画布 + 科普条整体上移，避免顶栏与主画面挤在一起 */
        .cosmic-stage {
            position: fixed;
            left: 0;
            width: 100vw;
            top: -52px;
            height: calc(100vh + 52px);
            z-index: 0;
            pointer-events: none;
        }

        .cosmic-stage #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
        }

        .cosmic-stage #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* Top HUD */
        .hud-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .scale-indicator {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 24px;
            pointer-events: auto;
            min-width: 320px;
        }

        .scale-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: var(--accent-cyan);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .scale-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .scale-distance {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
            margin-top: 2px;
        }

        .scale-live {
            font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
            font-size: 14px;
            color: var(--star-gold);
            letter-spacing: 0.4px;
            margin-top: 4px;
        }

        .scale-geo {
            font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
            font-size: 11px;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
            margin-top: 8px;
            line-height: 1.45;
            max-width: 100%;
            opacity: 0.92;
            overflow-wrap: anywhere;
        }

        /* 顶部居中：当前尺度科普（无底框，靠字重与阴影压在星场上） */
        .science-hint {
            position: absolute;
            top: 156px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            max-width: min(88vw, 620px);
            padding: 10px 18px;
            text-align: center;
            font-family: 'Noto Serif SC', 'Crimson Text', 'Songti SC', Georgia, serif;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.75;
            letter-spacing: 0.04em;
            color: rgba(236, 238, 248, 0.96);
            background: none;
            border: none;
            box-shadow: none;
            pointer-events: none;
            opacity: 0;
            text-shadow:
                0 0 16px rgba(5, 6, 18, 0.95),
                0 1px 2px rgba(5, 6, 18, 0.9),
                0 0 28px rgba(5, 6, 18, 0.75);
        }

        @media (max-width: 768px) {
            .science-hint {
                top: 138px;
                font-size: 14px;
                padding: 8px 12px;
                letter-spacing: 0.03em;
            }
        }

        .ctrl-btn.backdrop-off {
            opacity: 0.65;
            border-color: rgba(158, 153, 184, 0.35);
            color: var(--text-secondary);
        }

        .scale-bar-container {
            margin-top: 10px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .scale-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--star-gold));
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Philosophy Panel */
        .philosophy-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            padding-top: 28px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
        }

        .philosophy-panel.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .philosophy-panel.panel-dismissed {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden;
            transform: translateY(16px);
        }

        .corner-close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 26px;
            height: 26px;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(5, 8, 24, 0.55);
            color: rgba(200, 205, 230, 0.85);
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }

        .corner-close-btn:hover {
            color: var(--accent-cyan);
            border-color: rgba(0, 229, 255, 0.45);
            background: rgba(0, 229, 255, 0.08);
        }

        .philosophy-panel .corner-close-btn {
            top: 8px;
            right: 8px;
        }

        .philosophy-tag {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(0, 229, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .philosophy-quote {
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-style: italic;
        }

        .philosophy-author {
            font-size: 13px;
            color: var(--star-gold);
            text-align: right;
        }

        .philosophy-knowledge {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .knowledge-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: var(--accent-orange);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .knowledge-text {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        /* Right Controls */
        .controls-right {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }

        .ctrl-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--accent-cyan);
            transform: scale(1.08);
        }

        .ctrl-btn:active { transform: scale(0.95); }

        .ctrl-btn,
        .slider-node,
        .intro-start-btn,
        .corner-close-btn,
        .scene-card {
            touch-action: manipulation;
        }

        .ctrl-btn-compact {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0;
            line-height: 1.1;
            padding: 4px 2px;
        }

        .ctrl-btn.active {
            background: rgba(0, 229, 255, 0.2);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Scale Slider */
        .scale-slider-container {
            position: fixed;
            right: 90px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            pointer-events: auto;
        }

        .scale-slider-stack {
            position: relative;
            width: 32px;
            height: 420px;
        }

        .scale-slider-track {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            cursor: pointer;
            z-index: 1;
        }

        .slider-nodes {
            position: absolute;
            inset: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 2;
        }

        .slider-node {
            position: absolute;
            left: 50%;
            width: 16px;
            height: 16px;
            margin-left: -8px;
            margin-top: -8px;
            border-radius: 50%;
            background: rgba(158, 153, 184, 0.55);
            border: 2px solid var(--cosmos-black);
            box-sizing: border-box;
            cursor: pointer;
            pointer-events: auto;
            z-index: 4;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .slider-node::after {
            content: '';
            position: absolute;
            inset: -12px;
        }

        .slider-node:hover {
            transform: scale(1.2);
            background: rgba(0, 229, 255, 0.45);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.45);
        }

        .slider-node:active {
            transform: scale(1.05);
        }

        .scale-slider-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-cyan);
            border: 3px solid var(--cosmos-black);
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            transition: box-shadow 0.2s;
            z-index: 5;
            touch-action: none;
        }

        .scale-slider-thumb::after {
            content: '';
            position: absolute;
            inset: -14px;
        }

        .scale-slider-thumb:hover {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8);
        }

        .scale-labels {
            position: absolute;
            right: 20px;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .scale-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* Scene Gallery（外层含关闭钮） */
        .scene-gallery-outer {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: none;
        }

        .scene-gallery-outer.panel-dismissed {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden;
            transform: translateY(16px);
        }

        .scene-gallery-outer .corner-close-btn {
            position: static;
            pointer-events: auto;
        }

        .scene-gallery {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .scene-card {
            width: 180px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(30px);
        }

        .scene-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .scene-card:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2);
        }

        .scene-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .scene-card-info {
            padding: 10px 12px;
        }

        .scene-card-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .scene-card-year {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: var(--accent-cyan);
        }

        /* Intro Overlay */
        .intro-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            background: var(--cosmos-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease;
        }

        .intro-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .intro-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            text-align: center;
        }

        .intro-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.8;
        }

        .intro-start-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--accent-cyan);
            background: transparent;
            border: 1px solid var(--accent-cyan);
            padding: 14px 40px;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .intro-start-btn:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
        }

        .intro-stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Scene Modal */
        .scene-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .scene-modal.active {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 16px;
        }

        .scene-modal img {
            max-width: min(92vw, 1100px);
            max-height: min(62vh, 70dvh);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .scene-modal-caption {
            position: static;
            text-align: center;
            padding: 0 8px 8px;
        }

        .scene-modal-caption h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .scene-modal-caption p {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 500px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(10px);
            z-index: 80;
            max-width: min(88vw, 420px);
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(8, 12, 32, 0.94);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .touch-coach {
            position: fixed;
            left: 50%;
            bottom: calc(178px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 12;
            max-width: min(86vw, 360px);
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(8, 12, 32, 0.88);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            pointer-events: none;
        }

        .touch-coach[hidden] { display: none; }

        button:focus-visible,
        .scene-card:focus-visible,
        .slider-node:focus-visible {
            outline: 2px solid var(--accent-cyan);
            outline-offset: 2px;
        }

        /* Responsive — phones, small tablets, and short landscape */
        @media (max-width: 900px), (max-height: 520px) {
            .cosmic-stage {
                top: 0;
                height: 100%;
                height: 100dvh;
            }

            .hud-top {
                padding: max(10px, env(safe-area-inset-top)) 10px 0 max(10px, env(safe-area-inset-left));
            }

            .scale-indicator {
                min-width: 0;
                max-width: min(78vw, 340px);
                padding: 10px 12px;
                border-radius: 12px;
            }

            .scale-title { letter-spacing: 1.5px; margin-bottom: 2px; }
            .scale-name { font-size: 18px; line-height: 1.25; }
            .scale-distance { font-size: 12px; }
            .scale-live { font-size: 11px; }
            .scale-geo { max-width: 100%; font-size: 11px; }

            .science-hint {
                top: 158px;
                max-width: min(92vw, 520px);
                font-size: 13px;
                line-height: 1.55;
                padding: 4px 12px;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .controls-right {
                right: auto;
                left: max(8px, env(safe-area-inset-left));
                top: auto;
                bottom: calc(72px + env(safe-area-inset-bottom));
                transform: none;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                width: auto;
                max-width: calc(100vw - 16px);
                margin: 0 auto;
                right: max(8px, env(safe-area-inset-right));
            }

            .ctrl-btn {
                width: 44px;
                height: 44px;
                border-radius: 12px;
                font-size: 18px;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(8, 10, 28, 0.9);
            }

            .ctrl-btn:hover { transform: none; }

            .scale-slider-container {
                display: block;
                left: max(18px, env(safe-area-inset-left));
                right: max(18px, env(safe-area-inset-right));
                top: auto;
                bottom: calc(8px + env(safe-area-inset-bottom));
                transform: none;
                width: auto;
                touch-action: none;
            }

            .scale-slider-stack {
                width: 100%;
                height: 44px;
            }

            .scale-slider-track {
                left: 10px;
                right: 10px;
                top: 50%;
                width: auto;
                height: 4px;
                transform: translateY(-50%);
            }

            .scale-labels { display: none; }

            .scale-slider-thumb,
            .slider-node {
                top: 50%;
            }

            .philosophy-panel,
            .scene-card,
            .scale-indicator,
            .corner-close-btn {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }

            .scale-indicator { background: rgba(8, 10, 28, 0.88); }

            .philosophy-panel {
                left: 10px;
                right: 10px;
                bottom: calc(128px + env(safe-area-inset-bottom));
                max-width: none;
                max-height: min(34vh, 240px);
                overflow: auto;
                padding: 14px 36px 12px 14px;
                -webkit-overflow-scrolling: touch;
            }

            .philosophy-quote { font-size: 15px; line-height: 1.65; }
            .knowledge-text { font-size: 13px; }

            .scene-gallery-outer {
                left: 10px;
                right: 10px;
                bottom: calc(128px + env(safe-area-inset-bottom));
                align-items: stretch;
                max-width: none;
            }

            .scene-gallery {
                flex-direction: row;
                gap: 8px;
                overflow-x: auto;
                max-width: 100%;
                padding-bottom: 4px;
                -webkit-overflow-scrolling: touch;
            }

            .scene-card { width: 148px; flex: 0 0 148px; }
            .scene-card img { height: 78px; }
            .scene-card:hover { transform: none; }

            .intro-title { font-size: 32px; padding: 0 20px; }

/** 定位：unset 未请求 | locating 请求中 | naming 已有坐标、解析地名 | ready 完成 | denied 拒绝或不可用 */
let viewerGeoStatus = 'unset';
let viewerLat = 0;
let viewerLon = 0;
let viewerCityLabel = '';
let viewerWarmLine = '';
let geoHintTried = false;
let spaceGradient = null;
let lastCanvasW = 0;
let lastCanvasH = 0;
let lastDrawMs = 0;
let lastPhiloMs = 0;
let transitionStartMs = 0;
let zoomingFast = false;
let uiCache = { name: '', dist: '', live: '', geo: '', bar: -1 };
let resumeApplied = false;
let coachTimer = 0;

const COARSE_POINTER = window.matchMedia('(pointer: coarse)').matches || window.innerWidth < 900;
const RENDER = {
    pixelDensity: COARSE_POINTER ? 1 : Math.min(2, window.devicePixelRatio || 1),
    stars: COARSE_POINTER ? 1100 : 2800,
    galaxy: COARSE_POINTER ? 1400 : 3000,
    nebula: COARSE_POINTER ? 7 : 14,
    cityLights: COARSE_POINTER ? 90 : 200,
    nebulaSteps: COARSE_POINTER ? 4 : 6
};

function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
}

function layoutIsCompact() {
    return window.matchMedia('(max-width: 900px), (max-height: 520px)').matches;
}

function syncLayoutMode() {
    document.body.classList.toggle('layout-compact', layoutIsCompact());
}

function viewScale() {
    const m = Math.min(width, height);
    return Math.max(0.34, Math.min(1, m / 860));
}

function contentShiftY() {
    if (!layoutIsCompact()) return 0;
    if (window.innerHeight < 520) return -height * 0.05;
    return -height * 0.035;
}

const SUPERSCRIPT_DIGITS = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻' };

function toSuperscript(intString) {
    return String(intString).split('').map(function (ch) { return SUPERSCRIPT_DIGITS[ch] || ch; }).join('');
}

function formatLiveMeters(log) {
    const exp = Math.round(log * 10) / 10;
    const parts = exp.toFixed(1).split('.');
    const head = '此刻 ≈ 10' + toSuperscript(parts[0]);
    if (parts[1] === '0') return head + ' 米';
    return head + '·' + toSuperscript(parts[1]) + ' 米';
}

let hintPlaceAt = 0;
function placeScienceHint() {
    const hint = document.getElementById('scienceHint');
    if (!hint) return;
    const now = performance.now();
    if (now - hintPlaceAt < 250) return;
    hintPlaceAt = now;
    if (!layoutIsCompact() || window.innerHeight < 460) {
        hint.style.top = '';
        return;
    }
    const hud = document.querySelector('.scale-indicator');
    if (!hud) return;
    const bottom = hud.getBoundingClientRect().bottom;
    hint.style.top = Math.round(bottom + 14) + 'px';
}

function toast(message) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
}

function hideTouchCoach() {
    const el = document.getElementById('touchCoach');
    if (el) el.hidden = true;
    clearTimeout(coachTimer);
}

// --- Blackbody-ish star color from effective temperature (K), schematic ---
function blackbodyRGB(Teff) {
    Teff = constrain(Teff, 2800, 12000);
    let r, g, b;
    if (Teff < 4000) {
        r = 255;
        g = map(Teff, 2800, 4000, 70, 200);
        b = map(Teff, 2800, 4000, 30, 120);
    } else if (Teff < 6500) {
        r = map(Teff, 4000, 6500, 255, 255);
        g = map(Teff, 4000, 6500, 200, 245);
        b = map(Teff, 4000, 6500, 120, 255);
    } else {
        r = map(Teff, 6500, 12000, 255, 200);
        g = map(Teff, 6500, 12000, 245, 230);
        b = 255;
    }
    return [constrain(r, 0, 255), constrain(g, 0, 255), constrain(b, 0, 255)];
}

function formatLatLon(lat, lon) {
    let la = abs(lat).toFixed(4);
    let lo = abs(lon).toFixed(4);
    let ns = lat >= 0 ? 'N' : 'S';
    let ew = lon >= 0 ? 'E' : 'W';
    return la + '°' + ns + ' · ' + lo + '°' + ew;
}

function warmLineForPlace(placeName) {
    let n = placeName && String(placeName).trim() ? String(placeName).trim() : '这里';
    let h = 0;
    for (let i = 0; i < n.length; i++) h = (h + n.charCodeAt(i) * (i + 1)) % 997;
    let lines = [
        '愿你在' + n + '的这一夜，有星光与晚风，也有人懂你心里的安静。',
        n + '的天空和别处连着同一片宇宙——你站在这里，光从很远的地方赶来见你。',
        '不论' + n + '的街巷多喧闹，抬头的那一秒，都属于你和寂静的深空。',
    ];
    return lines[h % lines.length];
}

function buildGeoAdminLabel(data) {
    let prov = (data.principalSubdivision || '').trim();
    let city = (data.city || '').trim();
    let loc = (data.locality || '').trim();
    let label = '';
    if (loc) {
        if (prov && (!city || city === prov)) label = prov + ' · ' + loc;
        else if (prov && city) label = prov + ' · ' + city + ' · ' + loc;
        else label = loc;
    } else if (city && prov && city !== prov) label = prov + ' · ' + city;
    else label = city || prov || (data.countryName || '').trim() || '当前区域';
    if (label.length > 44) label = label.slice(0, 43) + '…';
    return label;
}

function refreshGeoHud() {
    if (typeof getCurrentLevelIndex !== 'function' || typeof updateUI !== 'function') return;
    try {
        updateUI(getCurrentLevelIndex());
    } catch (e) {}
}

function reverseGeocodeClientFill(lat, lon) {
    let url =
        'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' +
        encodeURIComponent(lat) +
        '&longitude=' +
        encodeURIComponent(lon) +
        '&localityLanguage=zh';
    fetch(url)
        .then(function (r) {
            return r.json();
        })
        .then(function (data) {
            if (viewerGeoStatus !== 'naming') return;
            viewerGeoStatus = 'ready';
            viewerCityLabel = buildGeoAdminLabel(data);
            let short =
                (data.locality || '').trim() ||
                (data.city || '').trim() ||
                (data.principalSubdivision || '').trim() ||
                '这里';
            viewerWarmLine = warmLineForPlace(short);
            refreshGeoHud();
        })
        .catch(function () {
            if (viewerGeoStatus !== 'naming') return;
            viewerGeoStatus = 'ready';
            viewerCityLabel = '当前区域';
            viewerWarmLine = warmLineForPlace('脚下这片土地');
            refreshGeoHud();
        });
}

function tryResolveGeolocation() {
    if (geoHintTried) return;
    if (typeof navigator === 'undefined' || !navigator.geolocation) {
        geoHintTried = true;
        viewerGeoStatus = 'denied';
        viewerCityLabel = '无法使用定位';
        viewerWarmLine = '这个环境不能定位。';
        refreshGeoHud();
        return;
    }
    geoHintTried = true;
    viewerGeoStatus = 'locating';
    viewerCityLabel = '正在获取你的位置…';
    viewerWarmLine = '允许位置后，会显示城市和经纬度。';
    refreshGeoHud();
    navigator.geolocation.getCurrentPosition(
        function (pos) {
            viewerLat = pos.coords.latitude;
            viewerLon = pos.coords.longitude;
            viewerGeoStatus = 'naming';
            viewerCityLabel = '正在匹配附近区域…';
            viewerWarmLine = '';
            reverseGeocodeClientFill(viewerLat, viewerLon);
            refreshGeoHud();
        },
        function () {
            viewerGeoStatus = 'denied';
            viewerLat = 0;
            viewerLon = 0;
            viewerCityLabel = '定位未开启';
            viewerWarmLine = '允许位置权限后，会显示城市和经纬度。';
            refreshGeoHud();
        },
        { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 }
    );
}

function regenerateAmbientField() {
    if (backdropMode === 2) {
        stars = [];
        nebulaClouds = [];
        return;
    }
    generateStars(RENDER.stars);
    generateNebulaClouds(backdropMode === 1 ? Math.max(6, Math.round(RENDER.nebula * 0.7)) : RENDER.nebula);
}

function cycleBackdropMode() {
    backdropMode = (backdropMode + 1) % 3;
    let btn = document.getElementById('physBackdropBtn');
    if (!btn) return;
    let labels = ['物', '理', '无'];
    let titles = [
        '背景：艺术星场（点击→物理：薄盘+银晕+ISM）',
        '背景：物理示意（点击→全关：无星场星云）',
        '背景：全关（点击→艺术星场）'
    ];
    btn.textContent = labels[backdropMode];
    btn.title = titles[backdropMode];
    btn.setAttribute('aria-pressed', backdropMode === 1 ? 'true' : 'false');
    btn.classList.toggle('active', backdropMode === 1);
    btn.classList.toggle('backdrop-off', backdropMode === 2);
    regenerateAmbientField();
}

// --- p5.js ---
function preload() {
    earthTextureImg = loadImage(
        'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
        function () {},
        function () {
            earthTextureImg = null;

function setup() {
    pixelDensity(RENDER.pixelDensity);
    let canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('canvas-container');
    noLoop();
    lastCanvasW = windowWidth;
    lastCanvasH = windowHeight;
    generateStars(RENDER.stars);
    generateNebulaClouds(RENDER.nebula);
    generateGalaxyParticles(RENDER.galaxy);
    generateSolarSystem();
    generateEarthFeatures();
    generateCityLights();
    buildSpaceGradient();
    syncLayoutMode();
    attachCanvasGestures(canvas.elt);
    stopAnimLoop();
    draw();

    // Auto-start journey after intro reading time
    setTimeout(() => {
        if (!journeyStarted) {
            startJourney();
        }
    }, 3500);
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    syncLayoutMode();
    const dw = Math.abs(windowWidth - lastCanvasW);
    const dh = Math.abs(windowHeight - lastCanvasH);
    lastCanvasW = windowWidth;
    lastCanvasH = windowHeight;
    if (dw > 80 || dh > 80 || !spaceGradient) buildSpaceGradient();
    layoutSlider();
    hintPlaceAt = 0;
    placeScienceHint();
    if (journeyStarted && (dw > 140 || dh > 140)) regenerateAmbientField();
}

// Custom animation loop using requestAnimationFrame (more reliable than p5's loop())
let animFrameId = null;

function startAnimLoop() {
    if (animFrameId) return;
    function tick() {
        draw();
        animFrameId = requestAnimationFrame(tick);
    }
    animFrameId = requestAnimationFrame(tick);
}

function stopAnimLoop() {
    if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
    }
}

function draw() {
    resetMatrix();
    frameCount2++;
    const nowMs = performance.now();
    let dt = lastDrawMs ? (nowMs - lastDrawMs) / 1000 : 1 / 60;
    lastDrawMs = nowMs;
    dt = clamp(dt, 0.001, 0.05);

    background(5, 5, 16);

    if (openingCruise) {
        // Constant log speed, so the Milky Way is not a blur on the way to the city.
        const next = currentLogScale - 1.15 * dt;
        if (next <= LOG_SCALE_MIN) {
            currentLogScale = LOG_SCALE_MIN;
            targetLogScale = LOG_SCALE_MIN;
            openingCruise = false;
        } else {
            currentLogScale = next;
            targetLogScale = next;
        }
        animating = false;
        zoomingFast = false;
    } else {
        // Frame-rate independent ease. tau is the time to close most of the gap.
        const tau = animating ? 0.42 : 0.34;
        const k = 1 - Math.exp(-dt / tau);
        currentLogScale += (targetLogScale - currentLogScale) * k;
        zoomingFast = Math.abs(targetLogScale - currentLogScale) > 0.28;

        if (Math.abs(currentLogScale - targetLogScale) < 0.012) {
            currentLogScale = targetLogScale;
            animating = false;
            zoomingFast = false;
        }
    }

    // Determine current scale level
    let levelIndex = getCurrentLevelIndex();

    // Draw layers based on scale. Shift the art above the phone dock.
    drawDeepSpace();
    const shift = contentShiftY();
    if (shift) translate(0, shift);
    drawNebulae(levelIndex);
    drawStars(levelIndex);
    drawGalaxy(levelIndex);
    drawSolarSystemView(levelIndex);
    drawEarthView(levelIndex);
    drawCityView(levelIndex);
    drawYouMarker(levelIndex);

    // Update UI
    const displayIndex = displayedLevelIndex(levelIndex);
    updateUI(displayIndex);

    // Draw scale transition label in center
    drawScaleTransition(displayIndex);

    // Auto play, about 0.9 log-units per second
    if (autoPlaying) {
        targetLogScale += autoPlayDir * 0.9 * dt;
        if (targetLogScale <= LOG_SCALE_MIN) { targetLogScale = LOG_SCALE_MIN; autoPlayDir = 1; }
        if (targetLogScale >= LOG_SCALE_MAX) { targetLogScale = LOG_SCALE_MAX; autoPlayDir = -1; }
    }

    // Philosophy rotation on a clock, so a slower phone does not flip quotes faster
    if (journeyStarted && nowMs - lastPhiloMs > 14000) {
        lastPhiloMs = nowMs;
        currentPhiloIndex = (currentPhiloIndex + 1) % PHILOSOPHY_DATA.length;
        updatePhilosophy(currentPhiloIndex);
    }
}

function getCurrentLevelIndex() {
    if (currentLogScale > SCALE_LEVELS[0].logSize) return 0;
    let n = SCALE_LEVELS.length;
    for (let i = 0; i < n - 1; i++) {
        let hi = SCALE_LEVELS[i].logSize;
        let lo = SCALE_LEVELS[i + 1].logSize;
        if (currentLogScale <= hi && currentLogScale > lo) return i;
    }
    return n - 1;
}

// --- Star Field ---
function generateStars(count) {
    stars = [];
    let cx = width * 0.5;
    let cy = height * 0.5;
    let Rmax = max(width, height) * 0.72;

    if (backdropMode === 1) {
        for (let i = 0; i < count; i++) {
            let diskPop = random() < 0.8;
            let x, y, Teff;
            if (diskPop) {
                let u = max(0.001, random());
                let R = -0.22 * Rmax * log(u);
                R = constrain(R, 0, Rmax * 1.05);
                let phi = random(TWO_PI);
                x = cx + cos(phi) * R + randomGaussian(0, Rmax * 0.012);
                y = cy + sin(phi) * R * 0.12 + randomGaussian(0, height * 0.028);
                Teff = random(4500, 9800);
            } else {
                let v = random();
                let r = pow(v, 1 / 2.4) * Rmax * 0.92;
                let theta = random(TWO_PI);
                let mu = 2 * random() - 1;
                let phi = random(TWO_PI);
                let st = sqrt(max(0, 1 - mu * mu));
                x = cx + r * st * cos(theta);
                y = cy + r * st * sin(theta) * 0.52 + r * mu * 0.22;
                Teff = random(3200, 5200);
            }
            let col = blackbodyRGB(Teff);
            stars.push({
                x: x,
                y: y,
                size: random(0.4, 2.6),
                brightness: random(90, 245),
                twinkleSpeed: random(0.008, 0.04),
                twinkleOffset: random(TWO_PI),
                color: col,
                glow: random() < 0.08
            });
        }
        return;
    }

    for (let i = 0; i < count; i++) {
        stars.push({
            x: random(-width * 2, width * 2),
            y: random(-height * 2, height * 2),
            size: random(0.5, 3),
            brightness: random(100, 255),
            twinkleSpeed: random(0.01, 0.05),
            twinkleOffset: random(TWO_PI),
            color: random([
                [255, 255, 255],
                [200, 220, 255],
                [255, 240, 200],
                [255, 200, 180],
                [180, 200, 255]
            ]),
            glow: random() < (COARSE_POINTER ? 0.05 : 0.12)
        });
    }
}

function drawStars(levelIndex) {
    if (backdropMode === 2) return;
    if (levelIndex >= 10) return;
    for (let s of stars) {
        let twinkle = sin(frameCount2 * s.twinkleSpeed + s.twinkleOffset) * 0.3 + 0.7;
        let alpha = s.brightness * twinkle;
        let sz = s.size;

        // Stars become more prominent at larger scales
        if (levelIndex <= 3) {
            sz *= 1.5;
        }

        let sx = (s.x - width / 2) * 0.5 + width / 2;
        let sy = (s.y - height / 2) * 0.5 + height / 2;

        // Wrap around
        sx = ((sx % width) + width) % width;
        sy = ((sy % height) + height) % height;

        noStroke();
        fill(s.color[0], s.color[1], s.color[2], alpha);
        ellipse(sx, sy, sz, sz);

        // Glow only for a few bright stars, and never while a fast zoom is in flight
        if (!zoomingFast && s.glow && s.size > 1.6 && levelIndex <= 5) {
            fill(s.color[0], s.color[1], s.color[2], alpha * 0.1);
            ellipse(sx, sy, sz * 4, sz * 4);
        }
    }
}

// --- Nebulae ---
function generateNebulaClouds(count) {
    nebulaClouds = [];
    if (backdropMode === 1) {
        let n = max(6, min(count, 12));
        for (let i = 0; i < n; i++) {
            let bandY = height * (0.38 + random(0.24));
            nebulaClouds.push({
                x: random(width * 0.12, width * 0.88),
                y: bandY + randomGaussian(0, height * 0.045),
                size: random(55, 160),
                color: random([
                    [165, 75, 135],
                    [120, 55, 125],
                    [95, 105, 175],
                    [140, 90, 150]
                ]),
                alpha: random(3, 11),
                drift: random(0.00015, 0.00065)
            });
        }
        return;
    }

    for (let i = 0; i < count; i++) {
        nebulaClouds.push({
            x: random(width),
            y: random(height),
            size: random(100, 400),
            color: random([
                [100, 50, 200],
                [50, 100, 200],
                [200, 50, 100],
                [50, 200, 150],
                [150, 80, 180]
            ]),
            alpha: random(5, 20),
            drift: random(0.0005, 0.002)
        });
    }
}

function drawNebulae(levelIndex) {
    if (backdropMode === 2) return;
    if (levelIndex > 5) return;
    let fadeAlpha = map(levelIndex, 3, 5, 1, 0);
    fadeAlpha = constrain(fadeAlpha, 0, 1);

    let wobbleX = backdropMode === 1 ? 10 : 30;
    let wobbleY = backdropMode === 1 ? 7 : 20;

    for (let n of nebulaClouds) {
        let nx = n.x + sin(frameCount2 * n.drift) * wobbleX;
        let ny = n.y + cos(frameCount2 * n.drift * 0.7) * wobbleY;
        let sz = n.size * (1 + sin(frameCount2 * 0.005 + n.x) * 0.1);

        if (zoomingFast && COARSE_POINTER) continue;
        noStroke();
        const steps = zoomingFast ? 3 : RENDER.nebulaSteps;
        const step = sz / steps;
        for (let r = sz; r > 0; r -= step) {
            let a = n.alpha * (r / sz) * fadeAlpha;
            fill(n.color[0], n.color[1], n.color[2], a);
            ellipse(nx, ny, r, r * 0.7);
        }
    }
}

function buildSpaceGradient() {
    if (typeof createGraphics !== 'function' || width < 2 || height < 2) return;
    try {
        const next = createGraphics(width, height);
        next.pixelDensity(1);
        next.clear();
        next.noStroke();
        const maxR = Math.max(width, height);
        const step = Math.max(18, maxR / (COARSE_POINTER ? 18 : 26));
        for (let r = maxR; r > 0; r -= step) {
            const t = r / maxR;
            const shade = 6 + (1 - t) * 14;
            next.fill(shade * 0.7, shade * 0.85, shade + 8, 16);
            next.ellipse(width / 2, height / 2, r, r);
        }
        spaceGradient = next;
    } catch (e) {
        spaceGradient = null;
    }
}

function drawDeepSpace() {
    let levelIndex = getCurrentLevelIndex();
    if (backdropMode === 2) {
        noStroke();
        fill(5, 5, 14);
        rect(0, 0, width, height);
        return;
    }
    if (spaceGradient && spaceGradient.width > 0) {
        image(spaceGradient, 0, 0, width, height);
    }
    // A cheap wash so the field warms slightly as the journey comes closer
    let wash = map(levelIndex, 0, SCALE_LEVELS.length - 1, 0, 28);
    noStroke();
    fill(8, 16, 36, wash);
    rect(0, 0, width, height);

    // 物理模式：银河系前景外示意 — 盘区消光尘埃带（中心动画不受影响）
    if (backdropMode === 1 && levelIndex <= 5) {
        let dustA = map(levelIndex, 0, 5, 22, 8);
        noStroke();
        fill(4, 4, 14, dustA);
        rectMode(CENTER);
        rect(width * 0.5, height * 0.5, width * 0.055, height * 0.92);
        rectMode(CORNER);
        fill(6, 6, 20, dustA * 0.45);
        ellipse(width * 0.5, height * 0.5, width * 0.2, height * 0.14);
    }
}

// --- Galaxy Particles (pre-generated for stable rendering) ---
function generateGalaxyParticles(count) {
    galaxyParticles = [];
    let numArms = 4;
    for (let i = 0; i < count; i++) {
        let arm = i % numArms;
        let armAngle = (arm / numArms) * TWO_PI;
        let t = i / count; // 0 to 1
        let dist = t;
        let angle = armAngle + dist * 6.0; // tighter spiral
        let spread = dist * 0.18;
        let offsetX = (Math.random() - 0.5) * spread * 2;
        let offsetY = (Math.random() - 0.5) * spread * 2;

        galaxyParticles.push({
            cosA: Math.cos(angle),
            sinA: Math.sin(angle),
            dist: dist,
            offsetX: offsetX,
            offsetY: offsetY,
            brightness: map(t, 0, 1, 255, 40),
            size: map(t, 0, 1, 2.8, 0.4),
            isCore: t < 0.15
        });
    }
}

// --- Galaxy ---
function drawGalaxy(levelIndex) {
    if (levelIndex < 1 || levelIndex > 4) return;
    let alpha = 1;
    if (levelIndex === 1) alpha = map(currentLogScale, SCALE_LEVELS[1].logSize, SCALE_LEVELS[2].logSize, 0.3, 1);
    if (levelIndex === 4) alpha = map(currentLogScale, SCALE_LEVELS[3].logSize, SCALE_LEVELS[4].logSize, 1, 0);
    alpha = constrain(alpha, 0, 1);

    push();
    translate(width / 2, height / 2);

    let galaxyRadius = min(width, height) * 0.38;
    let rotation = frameCount2 * 0.0003;
    let cosR = Math.cos(rotation);
    let sinR = Math.sin(rotation);
    let stride = (zoomingFast && COARSE_POINTER) ? 2 : 1;

    noStroke();
    for (let i = 0; i < galaxyParticles.length; i += stride) {
        let p = galaxyParticles[i];
        let d = p.dist * galaxyRadius;
        let cosA = p.cosA * cosR - p.sinA * sinR;
        let sinA = p.sinA * cosR + p.cosA * sinR;
        let sx = cosA * d + p.offsetX * galaxyRadius;
        let sy = sinA * d * 0.55 + p.offsetY * galaxyRadius * 0.55;

        if (p.isCore) {
            fill(255, 240, 200, p.brightness * alpha * 0.7);
        } else {
            fill(200, 215, 255, p.brightness * alpha * 0.5);
        }
        ellipse(sx, sy, p.size, p.size);
    }

    // Galaxy core glow
    let coreStep = (COARSE_POINTER || zoomingFast) ? 10 : 4;
    for (let r = 70; r > 0; r -= coreStep) {
        fill(255, 240, 200, map(r, 0, 70, 35, 0) * alpha);
        ellipse(0, 0, r, r * 0.55);
    }

    // Sun position marker (in Orion Arm)
    let sunAngle = 0.8 + rotation;
    let sunDist = galaxyRadius * 0.55;
    let sunX = cos(sunAngle) * sunDist;
    let sunY = sin(sunAngle) * sunDist * 0.55;

    if (levelIndex >= 2 && levelIndex <= 3) {
        let pulse = sin(frameCount2 * 0.05) * 0.3 + 0.7;
        fill(255, 200, 50, 200 * alpha * pulse);
        ellipse(sunX, sunY, 8, 8);
        fill(255, 200, 50, 50 * alpha * pulse);
        ellipse(sunX, sunY, 22, 22);

        fill(255, 200, 50, 200 * alpha);
        textAlign(CENTER);
        textSize(12);
        textFont('Noto Sans SC');
        text('☀ 太阳系位置', sunX, sunY - 16);
    }

    pop();
}

function drawSolarSystemView(levelIndex) {
    if (levelIndex < 4 || levelIndex > 7) return;

    let alpha = 1;
    if (levelIndex === 4) {
        alpha = map(currentLogScale, SCALE_LEVELS[4].logSize, SCALE_LEVELS[5].logSize, 0, 1);
    } else if (levelIndex === 6) {
        alpha = map(currentLogScale, SCALE_LEVELS[6].logSize, SCALE_LEVELS[7].logSize, 1, 0);
    } else if (levelIndex === 7) {
        /* log 接近 9（滑条「地月」节点）时应最亮；接近 7 时淡出交给「地球」档 —— 勿用 (7,9)→(1,0) 否则 log=9 时全透明 */
        alpha = map(currentLogScale, SCALE_LEVELS[8].logSize, SCALE_LEVELS[7].logSize, 0, 1);
    }
    alpha = constrain(alpha, 0, 1);

    push();
    translate(width / 2, height / 2);
    const s = viewScale();
    scale(s);
    const label = function (px) { textSize(px / s); };

    if (levelIndex === 4 || levelIndex === 5) {
        stroke(255, 255, 255, 20 * alpha);
        strokeWeight(0.5);
        noFill();
        for (let body of solarSystemBodies) {
            if (body.dist > 0) {
                let orbitSize = body.dist * 2;
                ellipse(0, 0, orbitSize, orbitSize);
            }
        }

        noStroke();
        for (let r = 80; r > 0; r -= 4) {
            fill(255, 200, 50, map(r, 0, 80, 15, 0) * alpha);
            ellipse(0, 0, r, r);
        }

        for (let i = 0; i < solarSystemBodies.length; i++) {
            let body = solarSystemBodies[i];
            let angle = frameCount2 * 0.002 * (1 / (i + 1)) + i * 0.7;
            let px = cos(angle) * body.dist;
            let py = sin(angle) * body.dist;

            fill(body.color[0], body.color[1], body.color[2], 255 * alpha);
            noStroke();
            ellipse(px, py, body.size, body.size);

            if (body.glow) {
                for (let r = body.size * 3; r > 0; r -= 2) {
                    fill(body.glow[0], body.glow[1], body.glow[2], map(r, 0, body.size * 3, 10, 0) * alpha);
                    ellipse(px, py, r, r);
                }
            }

            if (body.ring) {
                noFill();
                stroke(220, 200, 150, 150 * alpha);
                strokeWeight(2);
                ellipse(px, py, body.size * 2.2, body.size * 0.6);
            }

            if (body.dist > 0 && (s > 0.82 || body.name === '地球' || body.name === '木星' || body.name === '土星' || body.name === '火星')) {
                fill(255, 255, 255, 180 * alpha);
                noStroke();
                textAlign(CENTER);
                label(11);
                textFont('Noto Sans SC');
                text(body.name, px, py - body.size / 2 - 8);
            }
        }
    } else if (levelIndex === 6) {
        let earthBody = solarSystemBodies[3];
        let orbitSize = earthBody.dist * 2;
        stroke(255, 255, 255, 28 * alpha);
        strokeWeight(0.6);
        noFill();
        ellipse(0, 0, orbitSize, orbitSize);

        noStroke();
        for (let r = 72; r > 0; r -= 4) {
            fill(255, 200, 50, map(r, 0, 72, 14, 0) * alpha);
            ellipse(0, 0, r, r);
        }
        fill(255, 200, 50, 255 * alpha);
        ellipse(0, 0, 26, 26);

        let ang = frameCount2 * 0.003 + 1.1;
        let ex = cos(ang) * earthBody.dist;
        let ey = sin(ang) * earthBody.dist;
        for (let r = earthBody.size * 3; r > 0; r -= 2) {
            fill(earthBody.glow[0], earthBody.glow[1], earthBody.glow[2], map(r, 0, earthBody.size * 3, 12, 0) * alpha);
            ellipse(ex, ey, r, r);
        }
        fill(earthBody.color[0], earthBody.color[1], earthBody.color[2], 255 * alpha);
        ellipse(ex, ey, earthBody.size, earthBody.size);

        fill(255, 255, 255, 200 * alpha);
        textAlign(CENTER);
        textFont('Noto Sans SC');
        label(13);
        text('地球公转轨道（示意）', 0, -orbitSize * 0.52);
        label(12);
        text('太阳', 0, 36);
        text('地球', ex, ey - earthBody.size * 0.5 - 10);
    } else if (levelIndex === 7) {
        let moonDist = 58;
        let moonAng = frameCount2 * 0.065 + 0.4;
        let mx = cos(moonAng) * moonDist;
        let my = sin(moonAng) * moonDist * 0.9;

        noFill();
        stroke(255, 255, 255, 35 * alpha);
        strokeWeight(0.55);
        ellipse(0, 0, moonDist * 2, moonDist * 2 * 0.9);

        fill(50, 130, 230, 255 * alpha);
        noStroke();
        ellipse(0, 0, 22, 22);
        for (let r = 28; r > 0; r -= 2) {
            fill(100, 180, 255, map(r, 0, 28, 8, 0) * alpha);
            ellipse(0, 0, r, r);
        }

        fill(210, 210, 220, 255 * alpha);
        ellipse(mx, my, 9, 9);

        fill(255, 200, 50, 210 * alpha);
        ellipse(108, 18, 20, 20);

        fill(255, 255, 255, 195 * alpha);
        textAlign(CENTER);
        textFont('Noto Sans SC');
        label(13);
        text('地月系统（未按比例）', 0, -72);
        label(12);
        text('地球', 0, 38);
        text('月球', mx, my + 18);
        textAlign(LEFT);
        text('太阳（远景）', 88, 12);
    }

    pop();
}

function drawEarthTextureDisk(earthR, alpha, rotation) {
    if (!earthTextureImg || earthTextureImg.width <= 0) return false;
    let tw = earthTextureImg.width;
    let th = earthTextureImg.height;
    let dispW = earthR * 2.38;
    let dispH = dispW * (th / tw);
    let du = rotation % 1;
    if (du < 0) du += 1;
    let ox = -dispW * 0.5 - du * dispW;
    push();
    tint(255, Math.floor(245 * alpha));
    drawingContext.save();
    drawingContext.beginPath();
    drawingContext.arc(0, 0, earthR - 4, 0, Math.PI * 2);
    drawingContext.clip();
    for (let k = -2; k <= 2; k++) {
        image(earthTextureImg, ox + k * dispW, -dispH * 0.5, dispW, dispH, 0, 0, tw, th);
    }
    drawingContext.restore();
    pop();
    noTint();
    return true;
}

function drawEarthFallbackContinents(earthR, alpha, rotation, levelIndex) {
    for (let c of earthFeatures) {
        let blobs = c.blobs || [{ cx: c.cx, cy: c.cy, w: c.w, h: c.h }];
        let sumX = 0;
        let sumY = 0;
        let nB = 0;
        for (let b of blobs) {
            let du = (b.cx + rotation) % 1;
            if (du < 0) du += 1;
            let px = (du - 0.5) * earthR * 1.6;
            let py = (b.cy - 0.5) * earthR * 1.6;
            let pw = b.w * earthR * 1.6;
            let ph = b.h * earthR * 1.6;
            if (abs(px) < earthR * 0.92) {
                let visAlpha = map(abs(px), earthR * 0.5, earthR * 0.88, 1, 0.35);
                visAlpha = constrain(visAlpha, 0.35, 1);
                fill(52, 118, 72, 215 * alpha * visAlpha);
                noStroke();
                ellipse(px, py, pw, ph);
                sumX += px;
                sumY += py;
                nB++;
            }
        }
        if (levelIndex >= 8 && levelIndex <= 9 && nB > 0) {
            fill(255, 255, 255, 155 * alpha);
            textAlign(CENTER);
            textSize(10);
            textFont('Noto Sans SC');
            text(c.name, sumX / nB, sumY / nB);
        }
    }
}

function drawEarthView(levelIndex) {
    if (levelIndex < 8 || levelIndex > 9) return;
    let alpha = 1;
    if (levelIndex === 8) {
        alpha = map(currentLogScale, SCALE_LEVELS[7].logSize, SCALE_LEVELS[8].logSize, 0, 1);
    } else if (levelIndex === 9) {
        alpha = map(currentLogScale, SCALE_LEVELS[9].logSize, SCALE_LEVELS[10].logSize, 1, 0);
    }
    alpha = constrain(alpha, 0, 1);

    push();
    translate(width / 2, height / 2);

    let earthR = min(width, height) * 0.35;

    // Earth sphere
    // Ocean
    noStroke();
    for (let r = earthR; r > earthR - 5; r -= 1) {
        fill(30, 80, 180, map(r, earthR - 5, earthR, 0, 200) * alpha);
        ellipse(0, 0, r * 2, r * 2);
    }

    // Ocean fill
    fill(25, 70, 160, 230 * alpha);
    ellipse(0, 0, earthR * 2 - 10, earthR * 2 - 10);

    // Atmosphere glow
    for (let r = earthR + 30; r > earthR; r -= (COARSE_POINTER ? 6 : 3)) {
        fill(100, 180, 255, map(r, earthR, earthR + 30, 15, 0) * alpha);
        ellipse(0, 0, r * 2, r * 2);
    }

    // 大陆：优先 NASA/three.js 示例贴图（等距圆柱投影 + 圆形裁剪滚动）；失败则用多段椭圆回退
    let rotation = frameCount2 * 0.0003;
    let usedTex = drawEarthTextureDisk(earthR, alpha, rotation);
    if (!usedTex) {
        drawEarthFallbackContinents(earthR, alpha, rotation, levelIndex);
    }

    noFill();
    stroke(8, 18, 48, 70 * alpha);
    strokeWeight(2.5);
    ellipse(0, 0, earthR * 2 - 6, earthR * 2 - 6);

    // Cloud layer
    for (let i = 0; i < 8; i++) {
        let cloudAngle = rotation * 2 + i * 0.8;
        let cloudR = earthR * (0.3 + i * 0.08);
        let cx = cos(cloudAngle) * cloudR;
        let cy = sin(cloudAngle) * cloudR * 0.5;
        fill(255, 255, 255, 25 * alpha);
        ellipse(cx, cy, 40 + i * 10, 15 + i * 3);
    }

    // "You are here" marker for Asia
    if (levelIndex >= 9) {
        let markerX = 0.15 * earthR * 1.6;
        let markerY = -0.15 * earthR * 1.6;
        let pulse = sin(frameCount2 * 0.05) * 0.3 + 0.7;

        // Ping effect
        noFill();
        stroke(255, 100, 50, 100 * alpha * pulse);
        strokeWeight(2);
        let pingSize = 10 + sin(frameCount2 * 0.03) * 8;
        ellipse(markerX, markerY, pingSize, pingSize);

        fill(255, 100, 50, 255 * alpha);
        noStroke();
        ellipse(markerX, markerY, 6, 6);

        fill(255, 100, 50, 200 * alpha);
        textAlign(CENTER);
        textSize(12);
        textFont('Noto Sans SC');
        text('📍 你在这里', markerX, markerY - 15);
    }

    pop();
}

function drawCityView(levelIndex) {
    if (levelIndex !== 10) return;

    translate(width / 2, height / 2);

    for (let y = -300; y <= 300; y += 30) {

    textSize(11 / s);

// --- Scale Transition Label ---
let lastLevelIndex = -1;
let transitionAlpha = 0;

function drawScaleTransition(levelIndex) {
    if (levelIndex !== lastLevelIndex) {
        lastLevelIndex = levelIndex;
        transitionStartMs = performance.now();
    }
    const age = performance.now() - transitionStartMs;
    const hold = 650;
    const fade = 420;
    let a = 0;
    if (age < hold) a = 255;
    else if (age < hold + fade) a = 255 * (1 - (age - hold) / fade);
    else return;

    let level = SCALE_LEVELS[levelIndex];
    const y = layoutIsCompact() ? height * 0.34 : height * 0.46;
    textAlign(CENTER, CENTER);
    noStroke();
    textFont('Noto Sans SC');
    textSize(layoutIsCompact() ? 18 : 22);
    const nameW = textWidth(level.name);
    textFont('Orbitron');
    textSize(layoutIsCompact() ? 11 : 12);
    const distW = textWidth(level.distance);
    let labelW = Math.min(width * 0.88, Math.max(nameW, distW) + 56);

    fill(5, 5, 16, a * 0.78);
    rectMode(CENTER);
    rect(width / 2, y, labelW, layoutIsCompact() ? 58 : 64, 18);

    fill(0, 229, 255, a);
    textFont('Noto Sans SC');
    textSize(layoutIsCompact() ? 18 : 22);
    text(level.name, width / 2, y - 10);

    fill(255, 213, 79, a * 0.95);
    textSize(layoutIsCompact() ? 12 : 13);
    textFont('Noto Sans SC');
    text(formatLiveMeters(currentLogScale), width / 2, y + 14);

    rectMode(CORNER);
}

    if (!journeyStarted) {
        el.textContent = '';
        el.style.opacity = '0';
        return;
    }
    if (levelIndex !== scienceCaptionLevel) {
        scienceCaptionLevel = levelIndex;
        scienceCaptionPhaseStartMs = performance.now();
        el.textContent = SCIENCE_HINTS[levelIndex] || '';
    }
    let age = performance.now() - scienceCaptionPhaseStartMs;
    let cycle = SCI_CAP_FADE_IN_MS + SCI_CAP_HOLD_MS + SCI_CAP_FADE_OUT_MS + SCI_CAP_GAP_MS;
    age = age % max(1, cycle);
    let op = 0;
    if (age < SCI_CAP_FADE_IN_MS) {
        op = age / SCI_CAP_FADE_IN_MS;
    } else if (age < SCI_CAP_FADE_IN_MS + SCI_CAP_HOLD_MS) {
        op = 1;
    } else if (age < SCI_CAP_FADE_IN_MS + SCI_CAP_HOLD_MS + SCI_CAP_FADE_OUT_MS) {
        op = 1 - (age - SCI_CAP_FADE_IN_MS - SCI_CAP_HOLD_MS) / SCI_CAP_FADE_OUT_MS;
    } else {
        op = 0;
    }
    el.style.opacity = String(constrain(op, 0, 1));
}

function tryPlayAmbientMusic() {
    if (!ambientMusicEnabled) return;
    let a = document.getElementById('ambientAudio');
    if (!a) return;

    a.removeAttribute('crossorigin');
    a.loop = true;
    if ('playsInline' in a) a.playsInline = true;
    a.muted = false;
    a.defaultMuted = false;
    a.volume = 0.42;

    if (!a.dataset.ambientLoopHook) {
        a.dataset.ambientLoopHook = '1';
        a.addEventListener('ended', function () {
            if (!ambientMusicEnabled) return;
            try {
                a.currentTime = 0;
            } catch (eR) {}
            a.play().catch(function () {});
        });
    }

    if (!a.dataset.ambientErrHook) {
        a.dataset.ambientErrHook = '1';
        a.addEventListener('error', function () {
            if (a.dataset.ambientUrl === AMBIENT_LOCAL_MP3) return;
            delete a.dataset.ambientPlayPending;
            a.src = AMBIENT_LOCAL_MP3;
            a.dataset.ambientUrl = AMBIENT_LOCAL_MP3;
            try {
                a.load();
            } catch (e2) {}
            scheduleAmbientPlayWhenReady(a);
        });
    }

    if (!a.dataset.ambientUrl) {
        a.src = AMBIENT_REMOTE_MP3;
        a.dataset.ambientUrl = AMBIENT_REMOTE_MP3;
        try {
            a.load();
        } catch (e) {}
    }

    scheduleAmbientPlayWhenReady(a);
}

function scheduleAmbientPlayWhenReady(a) {
    function doPlay() {
        let pr = a.play();
        if (pr !== undefined && typeof pr.then === 'function') {
            pr.catch(function (err) {
                if (err && err.name === 'NotAllowedError') return;
                if (a.dataset.ambientUrl === AMBIENT_LOCAL_MP3) return;
                delete a.dataset.ambientPlayPending;
                a.src = AMBIENT_LOCAL_MP3;
                a.dataset.ambientUrl = AMBIENT_LOCAL_MP3;
                try {
                    a.load();
                } catch (e2) {}
                scheduleAmbientPlayWhenReady(a);
            });
        }
    }

    if (a.readyState >= 2) {
        doPlay();
    } else if (!a.dataset.ambientPlayPending) {
        a.dataset.ambientPlayPending = '1';
        a.addEventListener(
            'canplay',
            function () {
                delete a.dataset.ambientPlayPending;
                doPlay();
            },
            { once: true }
        );
    }
}

// --- Slider Drag ---
function setupSliderDrag() {
    buildSliderMilestoneNodes();

    if (scaleSliderListenersAttached) return;
    scaleSliderListenersAttached = true;

    let track = document.getElementById('sliderTrack');
    let thumb = document.getElementById('sliderThumb');

    function startDrag(e) {
        e.preventDefault();
        sliderDragging = true;
        handleDrag(e);
    }

    function handleDrag(e) {
        if (!sliderDragging) return;
        if (e.cancelable) e.preventDefault();
        let box = sliderIsHorizontal()
            ? document.getElementById('sliderStack').getBoundingClientRect()
            : track.getBoundingClientRect();
        let point = e.touches ? e.touches[0] : e;
        let t;
        if (sliderIsHorizontal()) {
            t = (point.clientX - box.left) / Math.max(1, box.width);
        } else {
            t = (point.clientY - box.top) / Math.max(1, box.height);
        }
        t = clamp(t, 0, 1);
        stopOpeningCruise();
        targetLogScale = LOG_SCALE_MAX + (LOG_SCALE_MIN - LOG_SCALE_MAX) * t;
        animating = true;
        startAnimLoop();
    }

    function stopDrag() {
        sliderDragging = false;
    }

    thumb.addEventListener('mousedown', startDrag);
    thumb.addEventListener('touchstart', startDrag, { passive: false });
    track.addEventListener('mousedown', startDrag);
    track.addEventListener('touchstart', startDrag, { passive: false });
    document.addEventListener('mousemove', handleDrag);
    document.addEventListener('touchmove', handleDrag, { passive: false });
    document.addEventListener('mouseup', stopDrag);
    document.addEventListener('touchend', stopDrag);
}

function readResumeLog() {
    const match = (location.hash || '').match(/at=([a-z0-9-]+)/i);
    if (match) {
        const id = match[1].toLowerCase();
        const found = SCALE_LEVELS.find(function (level) { return level.id === id; });
        if (found && found.id !== 'observable') return found.logSize;
    }
    try {
        const saved = sessionStorage.getItem('cosmicJourneyLog');
        if (saved != null && !(location.hash || '').match(/at=/i)) {
            const v = parseFloat(saved);
            if (!isNaN(v) && v < LOG_SCALE_MAX - 0.4) return clamp(v, LOG_SCALE_MIN, LOG_SCALE_MAX);
        }
    } catch (e) {}
    return null;
}

let hashToken = 0;
function syncJourneyHash(id) {
    if (!journeyStarted || !id) return;
    const next = '#at=' + id;
    const token = ++hashToken;
    setTimeout(function () {
        if (token !== hashToken) return;
        if (location.hash !== next) history.replaceState(null, '', next);
        try { sessionStorage.setItem('cosmicJourneyLog', currentLogScale.toFixed(3)); } catch (e) {}
    }, 200);
}

function attachCanvasGestures(elt) {
    if (!elt || elt.dataset.gesturesAttached) return;
    elt.dataset.gesturesAttached = '1';
    const points = new Map();
    let pinch = null;
    let drag = null;

    function remember(list) {
        for (let i = 0; i < list.length; i++) {
            const t = list[i];
            points.set(t.identifier, { x: t.clientX, y: t.clientY });
        }
    }

    elt.addEventListener('touchstart', function (e) {
        if (!journeyStarted) return;
        remember(e.changedTouches);
        hideTouchCoach();
        if (points.size >= 2) {
            stopOpeningCruise();
            const arr = Array.from(points.values());
            pinch = {
                dist: Math.max(12, Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y)),
                log: targetLogScale
            };
            drag = null;
        } else if (points.size === 1) {
            const p = Array.from(points.values())[0];
            drag = { y: p.y, log: targetLogScale, moved: false };
        }
    }, { passive: true });

    elt.addEventListener('touchmove', function (e) {
        if (!journeyStarted) return;
        remember(e.changedTouches);
        if (points.size >= 2 && pinch) {
            if (e.cancelable) e.preventDefault();
            const arr = Array.from(points.values());
            const dist = Math.max(12, Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y));
            const ratio = dist / pinch.dist;
            stopOpeningCruise();
            targetLogScale = clamp(pinch.log - Math.log10(ratio) * 7, LOG_SCALE_MIN, LOG_SCALE_MAX);
            animating = true;
            startAnimLoop();
        } else if (points.size === 1 && drag && !pinch) {
            const p = Array.from(points.values())[0];
            const dy = drag.y - p.y;
            if (!drag.moved && Math.abs(dy) < 10) return;
            drag.moved = true;
            stopOpeningCruise();
            if (e.cancelable) e.preventDefault();
            targetLogScale = clamp(drag.log - dy * 0.02, LOG_SCALE_MIN, LOG_SCALE_MAX);
            animating = true;
            startAnimLoop();
        }
    }, { passive: false });

    function endTouch(e) {
        for (let i = 0; i < e.changedTouches.length; i++) points.delete(e.changedTouches[i].identifier);
        if (points.size < 2) pinch = null;
        if (points.size === 0) drag = null;
        else if (points.size === 1) {
            const p = Array.from(points.values())[0];
            drag = { y: p.y, log: targetLogScale, moved: false };
        }
    }
    elt.addEventListener('touchend', endTouch);
    elt.addEventListener('touchcancel', endTouch);
}

// Keyboard lives on window so it still works after a button takes focus.
// Space toggles autoplay. Arrows and +/- zoom. R resets. F toggles fullscreen.
window.addEventListener('keydown', function (e) {
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (!journeyStarted) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            startJourney();
        }
        return;
    }
    if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        toggleAutoPlay();
    } else if (e.key === '+' || e.key === '=' || e.key === 'ArrowUp') {
        e.preventDefault();
        zoomIn();
    } else if (e.key === '-' || e.key === '_' || e.key === 'ArrowDown') {
        e.preventDefault();
        zoomOut();
    } else if (e.key === 'r' || e.key === 'R' || e.key === '0' || e.key === 'Home') {
        e.preventDefault();
        resetJourney();
    } else if (e.key === 'End') {
        e.preventDefault();
        snapToScaleLevel(SCALE_LEVELS.length - 1);
    } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
    } else if (e.key === 'Escape') {
        closeScene();
    }
});

window.addEventListener('wheel', applyWheelZoom, { passive: false });

document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });

// 任意一次点击/触摸后若旅程已开始且音乐仍暂停，再尝试播放（解决「仅自动开始旅程」无用户手势导致静音策略）
document.addEventListener(
    'pointerdown',
    function ambientResumeOnGesture() {
        if (!journeyStarted || !ambientMusicEnabled) return;
        let a = document.getElementById('ambientAudio');
        if (a && a.paused) tryPlayAmbientMusic();
    },
    { capture: true, passive: true }
);

window.addEventListener('resize', function () {
    syncLayoutMode();
    layoutSlider();
});

// Init
syncLayoutMode();
createIntroStars();
</script>
</body>
</html>
